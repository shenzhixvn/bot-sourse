<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self';">
<title>选词助手</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    font-family: 'PingFang SC', 'Microsoft YaHei', 'Segoe UI', sans-serif;
    background: transparent;
    overflow: hidden;
    user-select: none;
  }
  .quick-window {
    width: 100%; height: 100%;
    background: rgba(30, 30, 35, 0.96);
    border-radius: 12px;
    border: 1px solid rgba(255,255,255,0.1);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    backdrop-filter: blur(20px);
  }
  /* 标题栏 */
  .titlebar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 8px 12px;
    border-bottom: 1px solid rgba(255,255,255,0.08);
    -webkit-app-region: drag;
  }
  .titlebar-left { display: flex; align-items: center; gap: 6px; }
  .titlebar-icon { font-size: 14px; }
  .titlebar-title { font-size: 12px; color: rgba(255,255,255,0.85); font-weight: 600; }
  .titlebar-right { display: flex; gap: 4px; -webkit-app-region: no-drag; }
  .title-btn {
    width: 24px; height: 24px;
    border: none; background: transparent;
    color: rgba(255,255,255,0.6);
    font-size: 14px; cursor: pointer;
    border-radius: 4px;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.15s;
  }
  .title-btn:hover { background: rgba(255,255,255,0.1); color: #fff; }
  .title-btn.close:hover { background: rgba(234,102,104,0.8); color: #fff; }

  /* 原文预览 */
  .source-section {
    padding: 8px 12px;
    border-bottom: 1px solid rgba(255,255,255,0.06);
    max-height: 72px;
    overflow-y: auto;
  }
  .source-label {
    font-size: 10px; color: rgba(255,255,255,0.4);
    margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.5px;
  }
  .source-text {
    font-size: 12px; color: rgba(255,255,255,0.7);
    line-height: 1.5; white-space: pre-wrap; word-break: break-word;
  }
  .source-empty { color: rgba(255,255,255,0.3); font-style: italic; }

  /* 操作按钮 */
  .actions {
    display: flex; gap: 6px;
    padding: 8px 12px;
    flex-wrap: wrap;
  }
  .action-btn {
    flex: 1; min-width: 60px;
    padding: 6px 8px;
    border: 1px solid rgba(255,255,255,0.12);
    background: rgba(255,255,255,0.05);
    color: rgba(255,255,255,0.85);
    font-size: 12px; cursor: pointer;
    border-radius: 6px;
    transition: all 0.15s;
    white-space: nowrap;
  }
  .action-btn:hover { background: rgba(155,187,244,0.2); border-color: rgba(155,187,244,0.4); }
  .action-btn.active { background: rgba(155,187,244,0.3); border-color: rgba(155,187,244,0.6); color: #fff; }
  .action-btn:disabled { opacity: 0.4; cursor: not-allowed; }

  /* 自定义输入 */
  .custom-input-wrap {
    padding: 0 12px 8px;
    display: flex; gap: 6px;
  }
  .custom-input {
    flex: 1;
    padding: 6px 10px;
    border: 1px solid rgba(255,255,255,0.12);
    background: rgba(255,255,255,0.05);
    color: rgba(255,255,255,0.9);
    font-size: 12px;
    border-radius: 6px;
    outline: none;
  }
  .custom-input::placeholder { color: rgba(255,255,255,0.3); }
  .custom-input:focus { border-color: rgba(155,187,244,0.5); }
  .custom-send-btn {
    padding: 6px 12px;
    border: none;
    background: rgba(155,187,244,0.3);
    color: #fff;
    font-size: 12px; cursor: pointer;
    border-radius: 6px;
    transition: all 0.15s;
  }
  .custom-send-btn:hover { background: rgba(155,187,244,0.5); }
  .custom-send-btn:disabled { opacity: 0.4; cursor: not-allowed; }

  /* 结果区 */
  .result-section {
    flex: 1;
    padding: 8px 12px;
    overflow-y: auto;
    border-top: 1px solid rgba(255,255,255,0.06);
  }
  .result-label {
    font-size: 10px; color: rgba(255,255,255,0.4);
    margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.5px;
    display: flex; justify-content: space-between; align-items: center;
  }
  .result-status { font-size: 10px; color: rgba(155,187,244,0.8); }
  .result-text {
    font-size: 13px; color: rgba(255,255,255,0.92);
    line-height: 1.6; white-space: pre-wrap; word-break: break-word;
    user-select: text;
  }
  .result-empty { color: rgba(255,255,255,0.25); font-style: italic; font-size: 12px; }
  .result-error { color: rgba(234,102,104,0.9); font-size: 12px; }
  .streaming-cursor {
    display: inline-block;
    width: 2px; height: 14px;
    background: rgba(155,187,244,0.9);
    margin-left: 2px;
    vertical-align: text-bottom;
    animation: blink 0.8s infinite;
  }
  @keyframes blink { 0%,50% { opacity: 1; } 51%,100% { opacity: 0; } }

  /* 底部栏 */
  .footer {
    display: flex; justify-content: space-between; align-items: center;
    padding: 8px 12px;
    border-top: 1px solid rgba(255,255,255,0.08);
  }
  .footer-hint { font-size: 10px; color: rgba(255,255,255,0.3); }
  .footer-actions { display: flex; gap: 6px; }
  .footer-btn {
    padding: 5px 12px;
    border: 1px solid rgba(255,255,255,0.12);
    background: rgba(255,255,255,0.05);
    color: rgba(255,255,255,0.8);
    font-size: 11px; cursor: pointer;
    border-radius: 5px;
    transition: all 0.15s;
  }
  .footer-btn:hover { background: rgba(255,255,255,0.1); color: #fff; }
  .footer-btn.primary { background: rgba(155,187,244,0.3); border-color: rgba(155,187,244,0.5); color: #fff; }
  .footer-btn.primary:hover { background: rgba(155,187,244,0.5); }
  .footer-btn:disabled { opacity: 0.35; cursor: not-allowed; }

  /* 滚动条 */
  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 2px; }
  ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.25); }
</style>
</head>
<body>
<div class="quick-window">
  <!-- 标题栏 -->
  <div class="titlebar">
    <div class="titlebar-left">
      <span class="titlebar-icon">✨</span>
      <span class="titlebar-title">选词助手</span>
    </div>
    <div class="titlebar-right">
      <button class="title-btn close" id="btn-close" title="关闭 (Esc)">✕</button>
    </div>
  </div>

  <!-- 原文预览 -->
  <div class="source-section">
    <div class="source-label">选中文本</div>
    <div class="source-text" id="source-text">
      <span class="source-empty">正在获取选中文本...</span>
    </div>
  </div>

  <!-- 快捷操作 -->
  <div class="actions">
    <button class="action-btn" data-action="translate" title="中英互译">🌐 翻译</button>
    <button class="action-btn" data-action="summarize" title="总结要点">📝 总结</button>
    <button class="action-btn" data-action="explain" title="通俗解释">💡 解释</button>
    <button class="action-btn" data-action="polish" title="润色优化">✨ 润色</button>
  </div>

  <!-- 自定义指令 -->
  <div class="custom-input-wrap">
    <input type="text" class="custom-input" id="custom-input" placeholder="输入自定义指令，如：改成文言文、提取关键词..." spellcheck="false">
    <button class="custom-send-btn" id="btn-custom-send">执行</button>
  </div>

  <!-- 结果区 -->
  <div class="result-section">
    <div class="result-label">
      <span>处理结果</span>
      <span class="result-status" id="result-status"></span>
    </div>
    <div class="result-text" id="result-text">
      <span class="result-empty">选择上方操作按钮开始处理</span>
    </div>
  </div>

  <!-- 底部栏 -->
  <div class="footer">
    <span class="footer-hint">Esc 关闭 · 结果自动可选中复制</span>
    <div class="footer-actions">
      <button class="footer-btn" id="btn-stop" style="display:none;">⏹ 停止</button>
      <button class="footer-btn primary" id="btn-copy-result" disabled>📋 复制结果</button>
    </div>
  </div>
</div>
<script src="quick.js"></script>
</body>
</html>
